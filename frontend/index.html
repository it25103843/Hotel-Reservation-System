<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Halcyon House — Sign in</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>  
  <div class="hh-auth-wrap">
    <div class="hh-auth-visual">
      <img src="https://picsum.photos/seed/halcyon-facade/1200/1400" alt="Halcyon House facade" />
      <div class="hh-hero-overlay">
        <div class="hh-hero-title" style="color:#fff;max-width:340px;">A quiet house, well run.</div>
        <div class="hh-hero-sub">Sign in to manage rooms, guests, and the day's arrivals — or book your own stay.</div>
      </div>
    </div>
    <div class="hh-auth-form-side">
      <div class="hh-auth-box">
        <div class="hh-brand-mark" style="margin-bottom:14px;"></div>
        <h1 style="font-size:24px;margin-bottom:4px;">Halcyon House</h1>
        <p style="color:var(--ink-soft);font-size:13.5px;margin:0 0 22px;">Reservations &amp; operations</p>

        <div class="hh-auth-toggle">
          <button id="tabLogin" class="active" onclick="switchMode('login')">Sign in</button>
          <button id="tabRegister" onclick="switchMode('register')">Create A account</button>
        </div>

        <div id="errorBox" class="hh-error" style="display:none;"></div>

        <form id="loginForm" onsubmit="doLogin(event)">
          <div class="hh-field">
            <label class="hh-label">Email</label>
            <input class="hh-input" type="email" id="loginEmail" placeholder="Email" required />
          </div>
          <div class="hh-field">

            <label class="hh-label">Password</label>
            <input class="hh-input" type="password" id="loginPassword" placeholder="••••••••" required />
          </div>
          <button type="submit" class="hh-btn brass" style="width:100%;justify-content:center;padding:11px 0;">Sign in</button>
        </form>

        <form id="registerForm" onsubmit="doRegister(event)" style="display:none;">
          <div class="hh-field">
            <label class="hh-label">Full name</label>
            <input class="hh-input" type="text" id="regName" placeholder="Krishan Shan" required />
          </div>
          <div class="hh-field">
            <label class="hh-label">Email</label>
            <input class="hh-input" type="email" id="regEmail" placeholder="Email" required />
          </div>
          <div class="hh-field">
            <label class="hh-label">Password</label>
            <input class="hh-input" type="password" id="regPassword" placeholder="At least 6 characters" required minlength="6" />
          </div>
          <button type="submit" class="hh-btn brass" style="width:100%;justify-content:center;padding:11px 0;">Create account</button>
        </form>

        <div class="hh-hint">
          Admin: admin@halcyon.com / admin123
            Staff: staff@halcyon.com / staff123
            Guest: guest@halcyon.com / guest123
        </div>
      </div>
    </div>
  </div>

<script src="js/common.js"></script>
<script>
  // Root/login page always shows the sign-in form — it no longer auto-jumps
  // to a dashboard just because a session happens to be cached in this browser.

  function switchMode(mode) {
    document.getElementById("tabLogin").classList.toggle("active", mode === "login");
    document.getElementById("tabRegister").classList.toggle("active", mode === "register");
    document.getElementById("loginForm").style.display = mode === "login" ? "block" : "none";
    document.getElementById("registerForm").style.display = mode === "register" ? "block" : "none";
    hideError();
  }
  function showError(msg) {
    const box = document.getElementById("errorBox");
    box.textContent = msg;
    box.style.display = "block";
  }
  function hideError() { document.getElementById("errorBox").style.display = "none"; }

  async function doLogin(e) {
    e.preventDefault();
    hideError();
    try {
      const data = await api("/auth/login", {
        method: "POST",
        body: { email: document.getElementById("loginEmail").value.trim(), password: document.getElementById("loginPassword").value },
      });
      setSession(data);
      window.location.href = data.role === "CUSTOMER" ? "browse.html" : "dashboard.html";
    } catch (err) { showError(err.message); }
  }

  async function doRegister(e) {
    e.preventDefault();
    hideError();
    try {
      const data = await api("/auth/register", {
        method: "POST",
        body: {
          name: document.getElementById("regName").value.trim(),
          email: document.getElementById("regEmail").value.trim(),
          password: document.getElementById("regPassword").value,
        },
      });
      setSession(data);
      window.location.href = "browse.html";
    } catch (err) { showError(err.message); }
  }
</script>
</body>
</html>
