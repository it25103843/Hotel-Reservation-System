server.port=8080

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/halcyon_hotel?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Krishan2003
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# schema.sql / data.sql manage the schema, so Hibernate must not try to create/alter tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- SQL init (schema.sql + data.sql on the classpath) ----
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ---- JWT ----
jwt.secret=halcyon-house-super-secret-key-change-me-in-production-0123456789
jwt.expiration-ms=86400000

# ---- Misc ----
spring.servlet.multipart.max-file-size=5MB

# Make error responses include a readable "message" field for the frontend
server.error.include-message=always
server.error.include-binding-errors=always
